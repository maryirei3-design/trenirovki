<style>
/* Layout: phone column of soft rounded cards on a grey ground, black pill switcher, floating accent tab bar (after the reference) */
:root{
  --bg:#E8E9EC; --card:#F7F7F8; --pill:#FFFFFF; --ink:#111214; --muted:#7A7D85; --line:#DADCE0;
  --seg:#111214; --seg-ink:#FFFFFF; --seg-on:#FFFFFF; --seg-on-ink:#111214;
  --accent:#5798D7; --accent-ink:#FFFFFF; --accent-soft:#DCE9F6;
  --good:#2F8F5B; --good-soft:#DDF1E5; --warn:#B7791F; --warn-soft:#F8EBD3; --bad:#C2453D; --bad-soft:#F7DEDB;
  --ph-m:#D9707E; --ph-f:#5798D7; --ph-o:#8F7DD8; --ph-l:#E0A24E;
  --f:"Onest", "Helvetica Neue", Arial, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0F11; --card:#1A1B1E; --pill:#25272B; --ink:#F1F2F4; --muted:#9295A0; --line:#2E3035;
  --seg:#25272B; --seg-ink:#C9CBD1; --seg-on:#F1F2F4; --seg-on-ink:#111214;
  --accent:#6BA6DF; --accent-ink:#0B1520; --accent-soft:#1D2D3E;
  --good:#5DCB8E; --good-soft:#16301F; --warn:#E9B45C; --warn-soft:#352812; --bad:#EE8078; --bad-soft:#3A1C1A;
  --ph-m:#E68592; --ph-f:#6BA6DF; --ph-o:#A595E6; --ph-l:#EDB466; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0F11; --card:#1A1B1E; --pill:#25272B; --ink:#F1F2F4; --muted:#9295A0; --line:#2E3035;
  --seg:#25272B; --seg-ink:#C9CBD1; --seg-on:#F1F2F4; --seg-on-ink:#111214;
  --accent:#6BA6DF; --accent-ink:#0B1520; --accent-soft:#1D2D3E;
  --good:#5DCB8E; --good-soft:#16301F; --warn:#E9B45C; --warn-soft:#352812; --bad:#EE8078; --bad-soft:#3A1C1A;
  --ph-m:#E68592; --ph-f:#6BA6DF; --ph-o:#A595E6; --ph-l:#EDB466; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:18px 120px}
h1.title{font-weight:400;font-size:38px;letter-spacing:-.02em;margin:4px 4px 16px;line-height:1.05}
h2{font-weight:500;font-size:19px;margin:0;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--pill);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
input[type=number]{-moz-appearance:textfield;font-variant-numeric:tabular-nums}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.seg{display:grid;grid-auto-columns:1fr;grid-auto-flow:column;background:var(--seg);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;color:var(--seg-ink);border-radius:999px;padding:12px 6px;font-size:16px;line-height:1.1}
.seg button small{display:block;font-size:11px;opacity:.7;margin-top:2px}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--seg-on-ink)}

.navr{display:grid;grid-template-columns:54px 1fr 54px;gap:8px}
.navr .arrow{height:62px;border:0;border-radius:999px;background:var(--card);color:var(--accent);display:grid;place-items:center}
.navr .arrow[disabled]{opacity:.35;cursor:default}
.navr .arrow svg{width:22px;height:22px}
.navr .mid{background:var(--card);border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 10px;text-align:center;min-width:0}
.navr .mid b{color:var(--accent);font-weight:500;font-size:19px}
.navr .mid span{font-size:13px;color:var(--muted)}

.card{background:var(--card);border-radius:24px;padding:16px 16px 18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.goal{display:flex;justify-content:space-between;align-items:center;gap:8px}
.goal .lbl{font-size:16px}
.badge{border:1.5px solid var(--ink);border-radius:999px;padding:1px 8px;font-size:12.5px;white-space:nowrap}
.bar{height:2px;background:var(--line);margin:8px 0 12px;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.big{font-size:36px;font-weight:400;letter-spacing:-.02em;line-height:1.05}
.big small{font-size:16px;color:var(--muted);margin-left:2px}
.kl{font-size:14px;color:var(--ink);margin-top:auto}
.tile{display:flex;flex-direction:column;min-height:150px}

.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.up{background:var(--good-soft);color:var(--good)}
.pill.hold{background:var(--pill);color:var(--muted)}
.pill.down{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.ph{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap}
.ph::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}

/* exercise card */
.ex-name{font-size:17px;font-weight:500}
.target{font-size:13px;color:var(--muted);margin-top:1px}
.tip{font-size:13px;color:var(--muted);margin-top:6px}
.last{font-size:13px;background:var(--pill);border-radius:14px;padding:7px 10px;margin-top:10px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.wt{display:flex;align-items:center;gap:8px;margin-top:12px}
.wt input{width:90px;text-align:center;font-size:22px;padding:8px 4px;border-radius:14px}
.circ{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--accent);background:transparent;color:var(--accent);display:grid;place-items:center;font-size:20px;line-height:1}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px;margin-top:10px}
.sets label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);text-align:center}
.sets input{text-align:center;font-size:18px;padding:9px 2px;border-radius:14px}
.sets input.hit{border-color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:10px}
.chips .lbl{font-size:12px;color:var(--muted);margin-right:2px}
.chip{border:1px solid var(--line);background:var(--pill);border-radius:999px;padding:6px 10px;font-size:13.5px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.bad[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.note{width:100%;margin-top:10px;font-size:14px}

/* wellbeing scale: rings like the reference water tracker */
.scale{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.scale:last-of-type{border-bottom:0}
.scale .nm{font-size:14px}
.scale .nm small{display:block;color:var(--muted);font-size:11.5px}
.rings{display:flex;gap:6px;justify-content:flex-end}
.ring{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:transparent;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ring.on{border-color:var(--accent);color:var(--accent)}
.ring.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.primary{width:100%;border:0;background:var(--seg);color:var(--seg-ink);padding:16px;border-radius:999px;font-size:16px;font-weight:500}
.ghost{border:1px solid var(--line);background:var(--pill);border-radius:999px;padding:8px 14px;font-size:13.5px}
.ghost.danger{color:var(--bad);border-color:var(--bad)}
.link{border:0;background:none;color:var(--accent);padding:4px 0;font-size:13.5px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px 2px;text-align:center;margin-top:4px}
.cal .dow{font-size:13px;color:var(--muted);padding-bottom:4px}
.cal .d{height:40px;display:grid;place-items:center;font-size:16px;position:relative;font-variant-numeric:tabular-nums}
.cal .d.out{color:var(--muted);opacity:.45}
.cal .d.w span{background:var(--accent);color:var(--accent-ink);border-radius:50%;width:38px;height:38px;display:grid;place-items:center}
.cal .d.p::after{content:"";position:absolute;bottom:1px;width:5px;height:5px;border-radius:50%;background:var(--ph-m)}
.cal .d.t span{box-shadow:inset 0 0 0 1.5px var(--ink);border-radius:50%;width:38px;height:38px;display:grid;place-items:center}

.chart{width:100%;height:auto;display:block}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:11.5px;color:var(--muted);font-weight:500}
td.r,th.r{text-align:right}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.phbars{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.phbar .top{display:flex;justify-content:space-between;font-size:13.5px;gap:8px}
.phbar .track{height:10px;background:var(--pill);border-radius:999px;margin-top:5px;overflow:hidden}
.phbar .track i{display:block;height:100%;border-radius:999px;background:var(--c)}
.jitem{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.jitem:last-child{border-bottom:0}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:16px;padding:10px 14px;font-size:13px}
.confirm{background:var(--bad-soft);border-radius:16px;padding:10px 12px;font-size:13px}
.ringbox{position:relative;width:100%;max-width:240px;margin:0 auto}
.ringbox svg{display:block;width:100%;height:auto}
.ringc{position:absolute;inset:22%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.2;gap:2px}
.ringc b{font-size:46px;font-weight:400;letter-spacing:-.02em;line-height:1}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:10px}
.legend div{font-size:13px}
.legend b{font-weight:500}
.rules dt{font-weight:500;margin-top:10px}
.rules dd{margin:2px 0 0;color:var(--muted);font-size:14px}

nav.tabs{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5;pointer-events:none;padding-inline:16px}
nav.tabs .in{pointer-events:auto;background:var(--accent);border-radius:999px;padding:6px;display:flex;gap:6px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
nav.tabs button{width:62px;height:62px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:var(--accent-ink);display:grid;place-items:center}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{background:#FFFFFF;color:var(--accent)}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:10;white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:350px){.grid2{grid-template-columns:1fr}.scale{grid-template-columns:1fr}.rings{justify-content:flex-start}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

  <main id="view"></main>
</div>

    <button data-tab="progress" aria-label="Прогресс"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 19v-5M12 19V9M17 19v-8"/></svg></button>
    <button data-tab="cycle" aria-label="Цикл и замеры"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 8 8"/></svg></button>

</nav>

<script>
/* ---------- plan (fallback; the live one comes from the store, doc meta/plan) ---------- */
const DEFAULT_PLAN = {version:"Блок 1", from:"2026-10-13", note:"", days:{
  D1:{title:"Д1", sub:"Ягодицы + задняя", ex:[
    {id:"rdl",name:"Румынская тяга (Смит)",sets:3,min:8,max:10,start:30,step:2.5,tip:"Первой! Таз назад, гриф по ногам. Вес не растёт внутри тренировки."},
    {id:"bridge",name:"Ягодичный мост",sets:4,min:8,max:12,start:60,step:5,tip:"Пауза 1–2 с наверху, подбородок к груди. Полный вес тренажёра (гриф 36 + блины)."},
    {id:"bulg",name:"Болгарский сплит-присед",sets:3,min:10,max:10,start:0,step:2,tip:"Корпус чуть вперёд, начинать с левой. Вес — гантели в сумме."},
    {id:"curl",name:"Сгибания ног сидя",sets:3,min:12,max:15,start:22.5,step:2.5,tip:"Медленный негатив."},
    {id:"abd",name:"Отведения в тренажёре",sets:3,min:15,max:20,start:0,step:5,tip:"Корпус наклонён вперёд."},
    {id:"crunch",name:"Скручивания на блоке",sets:3,min:10,max:15,start:0,step:2.5,tip:"Таз неподвижен, рёбра к тазу."}]},
  D2:{title:"Д2", sub:"Верх", ex:[
    {id:"lat",name:"Верхняя тяга широким хватом",sets:3,min:8,max:12,start:40,step:2.5,tip:"Локти вниз-назад, не сводить перед собой."},
    {id:"row",name:"Горизонтальная тяга",sets:3,min:10,max:12,start:30,step:2.5,tip:"Лопатки сводить в конце."},
    {id:"dbpress",name:"Жим гантелей на наклонной",sets:3,min:10,max:12,start:9,step:1,tip:"Вес одной гантели."},
    {id:"lateral",name:"Махи в стороны",sets:3,min:12,max:20,start:0,step:1,tip:"Без раскачки, вес одной гантели."},
    {id:"face",name:"Тяга к лицу / задняя дельта",sets:2,min:15,max:15,start:0,step:2.5,tip:""},
    {id:"bi",name:"Бицепс",sets:2,min:12,max:12,start:0,step:1,tip:"Суперсет с трицепсом."},
    {id:"tri",name:"Трицепс",sets:2,min:12,max:12,start:0,step:2.5,tip:"Пауза 1 с внизу."},
    {id:"knees",name:"Подъёмы коленей в висе",sets:3,min:10,max:15,start:0,step:0,tip:"Без веса — оставь 0."}]},
  D3:{title:"Д3", sub:"Ягодицы + ср. ягодичная", ex:[
    {id:"bridgeH",name:"Ягодичный мост тяжёлый",sets:4,min:6,max:8,start:65,step:5,tip:"Тяжелее, чем в Д1."},
    {id:"legpress",name:"Жим одной ногой",sets:3,min:12,max:12,start:43,step:2.5,tip:"Стопа высоко и широко, начинать с левой. Полный вес с платформой (38 + блины)."},
    {id:"hyper",name:"Гиперэкстензия на ягодицы",sets:3,min:12,max:15,start:0,step:2.5,tip:"Спина круглая, подбородок к груди."},
    {id:"kick",name:"Отведение назад в кроссовере",sets:3,min:12,max:12,start:0,step:1.25,tip:"Начинать с левой."},
    {id:"abd3",name:"Отведения в тренажёре",sets:3,min:20,max:20,start:0,step:5,tip:""},
    {id:"pallof",name:"Паллоф-пресс",sets:3,min:10,max:10,start:0,step:1.25,tip:"На каждую сторону."},
    {id:"lat3",name:"Верхняя тяга (доп.)",sets:2,min:10,max:10,start:40,step:2.5,tip:"Доп. объём для спины."}]}
}};
const SAME = {bridgeH:"bridge", lat3:"lat", abd3:"abd"};
const histKey = id => SAME[id] || id;

/* ---------- store: everything lives on this phone (localStorage) + JSON copies ---------- */
const LKEY = "zal";
const ls = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};
const DATA_KEYS = ["workouts","periods","measures","plan"];
const S = {workouts: ls.get(LKEY+":workouts", []), periods: ls.get(LKEY+":periods", []), measures: ls.get(LKEY+":measures", []), plan: ls.get(LKEY+":plan", null)};
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
// one record per cycle start date (a phone entry and a base entry for the same day used to stay as two)
function dedupePeriods(){
  const seen = new Set(), out = S.periods.filter(p => p.date && !seen.has(p.date) && seen.add(p.date));
  if (out.length !== S.periods.length){ S.periods = out; ls.set(LKEY+":periods", out); return true; }
  return false;
}
dedupePeriods();

async function put(coll, obj){
  const arr = S[coll]; const i = arr.findIndex(x=>x.id===obj.id); if (i>=0) arr[i]=obj; else arr.push(obj);
  if (!ls.set(LKEY+":"+coll, arr)){ toast("Не сохранилось: память браузера заполнена"); throw new Error("quota"); }
  markDirty(coll); renderSoon();
}
async function del(coll, id){ S[coll] = S[coll].filter(x=>x.id!==id); ls.set(LKEY+":"+coll, S[coll]); markDirty(coll); renderSoon(); }

/* ---------- sync: private GitHub repo trenirovki-data, file data.json ----------
   Every change marks the store dirty and pushes the whole store a moment later.
   On open, a newer data.json (e.g. a plan Claude updated) is pulled in.
   Offline: the change waits (sync.pending) and goes out when the phone is back online. */
const REPO = "maryirei3-design/trenirovki-data", FILE = "data.json";
const sync = ls.get(LKEY+":sync", null) || {};
const saveSync = () => ls.set(LKEY+":sync", sync);
const LABEL = {workouts:"Тренировка", periods:"Цикл", measures:"Замер", plan:"Программа"};
let syncT = null, syncBusy = false, lastLabel = "Данные";
function markDirty(coll){
  if (!sync.token) return;
  lastLabel = LABEL[coll] || "Данные"; sync.pending = true; saveSync();
  clearTimeout(syncT); syncT = setTimeout(pushNow, 1200);
}
const b64e = str => { const bytes = new TextEncoder().encode(str); let bin = ""; for (let i=0;i<bytes.length;i+=0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000)); return btoa(bin); };
const b64d = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g,"")), c=>c.charCodeAt(0)));
function httpErr(status){ const e = new Error("http "+status); e.status = status; return e; }
async function ghFile(method, body){

    headers:{Authorization:`Bearer ${sync.token}`, Accept:"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28", ...(body?{"Content-Type":"application/json"}:{})},

function signal(e, ex){

  if (!ex || reps.length < ex.sets || n(e.rpe) == null) return reps.length ? "hold" : null;
  return Math.min(...reps) >= ex.max && n(e.rpe) <= 8 ? "up" : "hold";

// what went wrong in an exercise: "" all good, "pain", "tech"; old records only have pain:true
const ISSUES = [["","Всё ок"],["pain","Боль"],["tech","Техника"]];
const ISSUE_TXT = {"":"нет", pain:"боль", tech:"техника"};

function history(id){
  const k = histKey(id), out = [];

}

  const h = history(ex.id).filter(x => !draft || x.wid !== draft.id), last = h[h.length-1];

  if (s === "down") return {w: Math.max(0, +(n(last.w) - ex.step).toFixed(2)), why:`была боль, −${ex.step} кг`};
  return {w: last.w, why:"держим прошлый вес"};
}

function headPill(e, ex){

/* ---------- Прогресс ---------- */
function rangeBounds(){
  if (range === "week"){ const d = new Date(anchor+"T12:00:00"); const wd = (d.getDay()+6)%7; const a = addDays(anchor, -wd); return [a, addDays(a,6)]; }
  if (range === "month"){ const [y,m] = anchor.split("-"); const a = `${y}-${m}-01`; const nd = new Date(+y, +m, 0).getDate(); return [a, `${y}-${m}-${String(nd).padStart(2,"0")}`]; }
  const s = sortedW(); return [s[0]?.date || todayISO(), todayISO()];
}
function calendar(a, b){
  const wset = new Set(S.workouts.map(w=>w.date)), pset = new Set(starts()), t = todayISO();
  const dows = ["П","В","С","Ч","П","С","В"];
  let cells = "";
  let start = a; const wd = (new Date(a+"T12:00:00").getDay()+6)%7; start = addDays(a, -wd);
  let end = b; const we = (new Date(b+"T12:00:00").getDay()+6)%7; end = addDays(b, 6-we);
  for (let d = start; d <= end; d = addDays(d,1)){
    const cls = ["d", d<a||d>b?"out":"", wset.has(d)?"w":"", pset.has(d)?"p":"", d===t&&!wset.has(d)?"t":""].join(" ");
    cells += `<div class="${cls}" title="${fmtY(d)}${pset.has(d)?" · начало цикла":""}"><span>${+d.slice(8)}</span></div>`;
  }
  return `<div class="cal">${dows.map(x=>`<div class="dow">${x}</div>`).join("")}${cells}</div>`;
}
function lineChart(points, opts={}){
  if (points.length < 2) return `<p class="muted small">Для графика нужно хотя бы две записи.</p>`;
  const W=600,H=210,pl=42,pr=14,pt=14,pb=28;
  const ys = points.map(p=>p.y), lo = Math.floor(Math.min(...ys)*0.95), hi = Math.ceil(Math.max(...ys)*1.05) || 1;
  const xs = points.map(p=>p.x), x0 = Math.min(...xs), x1 = Math.max(...xs), span = (x1-x0)||1;
  const X = v => pl + (v-x0)/span*(W-pl-pr), Y = v => pt + (1-(v-lo)/((hi-lo)||1))*(H-pt-pb);
  const ticks = [lo,(lo+hi)/2,hi].map(v=>+v.toFixed(1));
  const path = points.map((p,i)=>`${i?"L":"M"}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||"")}">
    ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${pl-6}" y="${Y(t)+4}" text-anchor="end" font-size="12" fill="var(--muted)">${t}</text>`).join("")}
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    ${points.map((p,i)=>`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${i===points.length-1?6:4.5}" fill="${p.c||"var(--accent)"}" stroke="var(--card)" stroke-width="2"/>`).join("")}
    ${points.map((p,i)=>(i===0||i===points.length-1||points.length<=6)?`<text x="${X(p.x)}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--muted)">${esc(p.lbl)}</text>`:"").join("")}
  </svg>`;

function phaseScatter(ws, best){

function ringSVG(c){
  const L = c ? c.L : typicalLen(), phs = phasesFor(L), R = 92, C = 2*Math.PI*R;
  const arc = (a,b,col) => { const len = (b-a+1)/L*C - 3; const off = -((a-1)/L*C); return `<circle cx="120" cy="120" r="${R}" fill="none" stroke="${col}" stroke-width="16" stroke-dasharray="${Math.max(0,len)} ${C}" stroke-dashoffset="${off}" stroke-linecap="round" transform="rotate(-90 120 120)" opacity=".9"/>`; };
  let marker = "";
  if (c){ const ang = (Math.min(c.dc, L) - .5)/L*2*Math.PI - Math.PI/2; marker = `<circle cx="${120+R*Math.cos(ang)}" cy="${120+R*Math.sin(ang)}" r="12" fill="var(--card)" stroke="var(--ink)" stroke-width="3"/>`; }
  // centre text is HTML over the ring, so it stays centred and wraps on any phone width
  return `<div class="ringbox"><svg viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Кольцо цикла">
    <circle cx="120" cy="120" r="${R}" fill="none" stroke="var(--line)" stroke-width="16"/>
    ${phs.map(p=>arc(p.a,p.b,p.c)).join("")}${marker}
  </svg><div class="ringc"><span class="muted small">день цикла</span><b>${c?c.dc:"—"}</b>${c?(c.over?`<span class="small" style="color:var(--warn)">+${c.over} к обычной длине</span>`:`<span class="muted small">обычно ~${c.usual} дн.</span>`):`<span class="muted small">нет дат</span>`}</div></div>`;
}
function vCycle(){

  return `<h1 class="title">Цикл</h1><div class="stack">${banner()}

    <section class="card stack">
      <div class="goal"><h2>Начала циклов</h2><span class="badge num">${per.length}</span></div>
      <div class="tablewrap"><table><thead><tr><th>Начало</th><th class="r">Длина</th><th>Статус</th><th></th></tr></thead><tbody>
      ${per.slice().reverse().map(p=>{const i=per.indexOf(p), nx=per[i+1], len=nx?days(p.date,nx.date):null; const st=len==null?["hold","идёт"]:len>35?["warn","длинный"]:len<21?["warn","короткий"]:["up","норма"]; if (editP===p.id) return `<tr><td colspan="4"><div class="row"><input type="date" id="pe-date" value="${p.date}" aria-label="Дата начала цикла"><button class="ghost" data-act="pe-save" data-id="${p.id}" style="border-color:var(--accent);color:var(--accent)">Сохранить</button><button class="link" data-act="pe-cancel" style="color:var(--muted)">Отмена</button></div></td></tr>`;
        return `<tr><td class="num">${fmtY(p.date)}</td><td class="r num">${len??(c&&c.start===p.date?c.dc+"…":"—")}</td><td><span class="pill ${st[0]}">${st[1]}</span></td><td class="r" style="white-space:nowrap">${confirmDel===p.id?`<button class="ghost danger" data-act="del-p" data-id="${p.id}">Удалить</button>`:`<button class="link" data-act="pe-edit" data-id="${p.id}">Изменить</button> <button class="link" data-act="del-ask" data-id="${p.id}" style="color:var(--muted);padding-inline:6px" aria-label="Удалить">×</button>`}</td></tr>`}).join("") || `<tr><td colspan="4" class="muted">Дат пока нет</td></tr>`}
      </tbody></table></div>
      <div class="row"><input type="date" id="p-date" value="${todayISO()}" aria-label="Дата начала месячных"><button class="ghost" data-act="add-period">Добавить начало</button></div>
      <p class="muted small" style="margin:0">Дату можно поправить прямо в таблице. Даты переносишь из Flo.</p>
    </section>
    <section class="card stack">
      <div class="goal"><h2>Замеры</h2><span class="badge">раз в 4 недели</span></div>
      <div class="tablewrap"><table><thead><tr><th>Дата</th><th class="r">ДЦ</th><th class="r">Талия</th><th class="r">Бёдра</th><th class="r">Бедро</th><th class="r">Грудь</th><th>Окно</th><th></th></tr></thead><tbody>
      ${ms.slice().reverse().map(m=>{const cc=cycleOn(m.date), dc=cc?.dc, ok=dc>=5&&dc<=10; return `<tr><td class="num">${fmtY(m.date)}</td><td class="r num">${dc??"—"}</td><td class="r num">${m.waist||"—"}<div class="muted" style="font-size:11px">${m===base?"старт":delta(m.waist,base.waist)}</div></td><td class="r num">${m.hips||"—"}<div class="muted" style="font-size:11px">${m===base?"старт":delta(m.hips,base.hips)}</div></td><td class="r num">${m.thigh||"—"}</td><td class="r num">${m.chest||"—"}</td><td>${dc==null?"":`<span class="pill ${ok?"up":"warn"}">${ok?"5–10 ДЦ":"вне окна"}</span>`}</td><td class="r">${confirmDel===m.id?`<button class="ghost danger" data-act="del-m" data-id="${m.id}">Удалить</button>`:`<button class="link" data-act="del-ask" data-id="${m.id}" style="color:var(--muted)" aria-label="Удалить">×</button>`}</td></tr>`}).join("") || `<tr><td colspan="8" class="muted">Замеров пока нет</td></tr>`}
      </tbody></table></div>
      <div class="form">
        <label>Дата<input type="date" id="m-date" value="${todayISO()}"></label>
        <label>Талия, см<input type="number" inputmode="decimal" id="m-waist"></label>
        <label>Бёдра, см<input type="number" inputmode="decimal" id="m-hips"></label>
        <label>Бедро, см<input type="number" inputmode="decimal" id="m-thigh"></label>
        <label>Грудь, см<input type="number" inputmode="decimal" id="m-chest"></label>
      </div>
      <button class="ghost" data-act="add-measure" style="align-self:flex-start">Добавить замер</button>
      <p class="muted small" style="margin:0">На 5–10 день цикла, утром. Фото в тот же день, тот же свет и позы.</p>
    </section>
  </div>`;
}

/* ---------- План ---------- */
function vPlan(){
  const P = PLAN();
  return `<h1 class="title">План</h1><div class="stack">${banner()}
    <section class="card">
      <div class="goal"><h2>${esc(P.version||"Текущий блок")}</h2><span class="badge">с ${P.from?fmtY(P.from):"—"}</span></div>
      <div class="bar"><i style="width:${P.from?Math.min(100,days(P.from,todayISO())/56*100):0}%"></i></div>
      <p class="small" style="margin:0">${P.note?esc(P.note):"Блок на 6–8 недель. Веса растут сами по подсказкам после каждой тренировки, состав упражнений Claude меняет после недельного разбора."}</p>
      ${P.updated?`<p class="muted small" style="margin:6px 0 0">Обновлено ${fmtY(P.updated)}</p>`:""}
    </section>
    ${Object.keys(P.days).map(k=>{const d=P.days[k]; return `<section class="card"><div class="goal"><h2>${d.title} · ${esc(d.sub)}</h2><span class="badge num">${d.ex.length} упр.</span></div><div class="bar"><i style="width:100%"></i></div>
      <div class="tablewrap"><table><tbody>${d.ex.map(e=>{const s=suggest(e); return `<tr><td style="white-space:normal">${esc(e.name)}</td><td class="r num muted">${e.sets}×${e.min===e.max?e.min:e.min+"–"+e.max}</td><td class="r num">${s.w!==""&&s.w!=null&&+s.w>0?s.w+" кг":"—"}</td></tr>`}).join("")}</tbody></table></div></section>`}).join("")}
    <section class="card">
      <div class="goal"><h2>RPE по запасу</h2><span class="badge">не по жжению</span></div><div class="bar"><i style="width:80%"></i></div>
      <div class="tablewrap"><table><tbody>
        <tr><td class="num">6</td><td>Могла бы ещё 4+ повтора</td></tr><tr><td class="num">7</td><td>Ещё 3 повтора</td></tr>
        <tr><td class="num" style="color:var(--accent)">8</td><td>Ещё 2 — основная рабочая зона</td></tr><tr><td class="num">9</td><td>Ещё 1 повтор</td></tr>
        <tr><td class="num">10</td><td>Больше ни одного. «Еле дотащила» = 9.5–10</td></tr></tbody></table></div>
    </section>
    <section class="card"><h2>Правила</h2><dl class="rules">
      <dt>Двойная прогрессия</dt><dd>Добила верх диапазона во всех подходах на RPE ≤8 → +2.5–5 кг → снова от нижней границы.</dd>
      <dt>Румынка</dt><dd>Всегда первой. Вес по первому подходу, внутри тренировки не растёт. Поясница заныла — стоп.</dd>
      <dt>Асимметрия</dt><dd>Односторонние с левой, правой столько же повторов.</dd>
      <dt>Тренажёр мостика</dt><dd>Полный вес (гриф 36 + блины), со штангой не сравнивать.</dd></dl></section>
    <section class="card"><div class="goal"><h2>Питание</h2><span class="badge">6–8 недель</span></div><div class="bar"><i style="width:100%"></i></div>
      <div class="tablewrap"><table><tbody><tr><td>Калории</td><td class="r num">1800–1850</td></tr><tr><td>Белок</td><td class="r num">120–125 г</td></tr><tr><td>Жиры</td><td class="r num">50–65 г</td></tr><tr><td>Шаги</td><td class="r num">8–10 тыс.</td></tr><tr><td>Креатин</td><td class="r num">3–5 г</td></tr></tbody></table></div></section>
    ${backupCard()}
  </div>`;
}

/* ---------- export ---------- */
function exportRows(){
  const best = bestMap(), ws = sortedW();
  const fl = w => (w.feel?.flags||[]).join(", ");
  const trainings = [["Дата","День","ДЦ","Фаза","Энергия","Настроение","Сон","Крепатура","Стресс","Отметки","Самочувствие","Тоннаж, кг","Сила, % от лучшего"]];
  const exRows = [["Дата","ДЦ","Фаза","День","Упражнение","Вес, кг","Повторы","RPE","Боль/техника","Расч. максимум","% от лучшего","Сигнал","Ощущения"]];
  for (const w of ws){
    const c = cycleOn(w.date), F = w.feel||{}, p = perf(w,best);
    trainings.push([w.date, w.day, c?.dc??"", c?PH[c.phase].name:"", F.energy??"", F.mood??"", F.sleep??"", F.sore??"", F.stress??"", fl(w), F.note||"", Math.round(tonnage(w)), p!=null?Math.round(p):""]);
    for (const e of (w.entries||[])){ const v = e1rm(e), b = best[histKey(e.ex)], s = signal(e,EX[e.ex]);
      exRows.push([w.date, c?.dc??"", c?PH[c.phase].name:"", w.day, EX[e.ex]?.name||e.ex, n(e.w)??"", (e.reps||[]).join("/"), e.rpe??"", ISSUE_TXT[issueOf(e)], v?+v.toFixed(1):"", v&&b?Math.round(v/b*100):"", s?SIG[s][1]:"", e.note||""]); }
  }
  const phase = [["Фаза","Тренировок","Сила, % от лучшего","Энергия ср.","Настроение ср.","Крепатура ср."]];
  for (const k of ["m","f","o","l"]){ const sel = ws.filter(w=>cycleOn(w.date)?.phase===k); const pv = sel.map(w=>perf(w,best)).filter(v=>v!=null); const f = key => { const a = sel.map(w=>w.feel?.[key]).filter(v=>v!=null); return a.length?+avg(a).toFixed(1):""; };
    phase.push([PH[k].name, sel.length, pv.length?Math.round(avg(pv)):"", f("energy"), f("mood"), f("sore")]); }
  const per = starts(); const cyc = [["Начало","Длина, дней"]]; per.forEach((d,i)=>cyc.push([d, per[i+1]?days(d,per[i+1]):""]));
  const mz = [["Дата","ДЦ","Талия","Бёдра","Бедро","Грудь"]]; for (const m of [...S.measures].sort((a,b)=>a.date.localeCompare(b.date))) mz.push([m.date, cycleOn(m.date)?.dc??"", m.waist??"", m.hips??"", m.thigh??"", m.chest??""]);
  return {"Тренировки":trainings, "Упражнения":exRows, "По фазам":phase, "Цикл":cyc, "Замеры":mz};
}
function loadXLSX(){ return new Promise((res,rej)=>{ if (window.XLSX) return res(window.XLSX); const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload = ()=>res(window.XLSX); s.onerror = rej; document.head.appendChild(s); }); }
async function doExport(){
  let X; try{ X = await loadXLSX(); }catch(e){ toast("Для Excel нужен интернет"); return; }
  const wb = X.utils.book_new(), rows = exportRows();
  for (const name in rows){ const sh = X.utils.aoa_to_sheet(rows[name]); sh["!cols"] = rows[name][0].map(h=>({wch:Math.max(10, String(h).length+2)})); X.utils.book_append_sheet(wb, sh, name); }
  const buf = X.write(wb, {bookType:"xlsx", type:"array"});
  const file = new File([buf], `Трекер-${todayISO()}.xlsx`, {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  if (await shareOrDownload(file, "Трекер тренировок")) toast("Готово");
}
async function copyCSV(){
  const r = exportRows()["Упражнения"]; const csv = r.map(row=>row.map(v=>{const s=String(v); return /[",;\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s;}).join(",")).join("\n");
  try{ await navigator.clipboard.writeText(csv); toast("Скопировано — вставь в Google Таблицу"); } catch(e){ toast("Копирование недоступно в этом окне"); }
}

/* ---------- render ---------- */
function render(){
  pending = false;
  const V = {train:vTrain, progress:vProgress, cycle:vCycle, plan:vPlan}[tab] || vTrain;
  view.innerHTML = V();
  document.querySelectorAll("nav.tabs button").forEach(b => b.dataset.tab===tab ? b.setAttribute("aria-current","page") : b.removeAttribute("aria-current"));
}
function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2400); }

document.querySelector("nav.tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]"); if (!b) return;
  tab = b.dataset.tab; ls.set(LKEY+":tab", tab); confirmDel = null; render(); window.scrollTo(0,0);
});
view.addEventListener("focusout", () => { setTimeout(()=>{ if (pending) renderSoon(); }, 0); });

view.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "feel-note"){ draft.feel.note = el.value; saveDraft(); return; }
  if (el.id === "feel-dc"){ clearTimeout(dcT); dcT = el.value === "" ? null : setTimeout(flushDC, 900); return; }
  const card = el.closest("[data-i]"); if (!card || !draft) return;
  const en = draft.entries[+card.dataset.i], ex = EX[en.ex] || {max:99, sets:en.reps.length};
  if (el.dataset.f === "w") en.w = el.value === "" ? "" : +el.value;
  if (el.dataset.f === "r"){ en.reps[+el.dataset.j] = el.value === "" ? "" : +el.value; el.classList.toggle("hit", n(el.value)!=null && +el.value >= ex.max); card.querySelector("[data-pill]").innerHTML = headPill(en, ex); }
  if (el.dataset.f === "note") en.note = el.value;
  saveDraft();
});
view.addEventListener("change", async e => {
  const el = e.target;
  if (el.id === "d-date" && el.value){ draft.date = el.value; saveDraft(); render(); }
  if (el.id === "prog-ex"){ progEx = el.value; render(); }
  if (el.id === "feel-dc" && el.value !== ""){ clearTimeout(dcT); dcT = null; el.blur(); await applyDC(Math.round(+el.value)); }
});
view.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.day){ if (b.dataset.day !== draft.day){ newDraft(b.dataset.day, draft.date); render(); } return; }
  if (b.dataset.range){ range = b.dataset.range; anchor = todayISO(); ls.set(LKEY+":range", range); render(); return; }
  const act = b.dataset.act; if (!act) return;
  const card = b.closest("[data-i]");
  if (card){
    const en = draft.entries[+card.dataset.i], ex = EX[en.ex] || {step:2.5, max:99, sets:en.reps.length};
    if (act === "w+" || act === "w-"){ const st = ex.step || 1; en.w = Math.max(0, +((+en.w||0) + (act==="w+"?st:-st)).toFixed(2)); card.querySelector('[data-f="w"]').value = en.w; saveDraft(); return; }
    if (act === "rpe"){ en.rpe = +b.dataset.v === n(en.rpe) ? "" : +b.dataset.v; card.querySelectorAll('[data-act="rpe"]').forEach(c=>c.setAttribute("aria-pressed", +c.dataset.v===n(en.rpe))); card.querySelector("[data-pill]").innerHTML = headPill(en, ex); saveDraft(); return; }
    if (act === "issue"){ en.issue = b.dataset.v; en.pain = !!en.issue; card.querySelectorAll('[data-act="issue"]').forEach(c=>c.setAttribute("aria-pressed", c.dataset.v===en.issue)); card.querySelector("[data-pill]").innerHTML = headPill(en, ex); saveDraft(); return; }
  }
  if (act === "feel"){ const k = b.closest("[data-feel]").dataset.feel, v = +b.dataset.v; draft.feel[k] = draft.feel[k] === v ? null : v; saveDraft(); render(); return; }
  if (act === "flag"){ const f = draft.feel.flags || (draft.feel.flags = []); const v = b.dataset.v; const i = f.indexOf(v); i>=0 ? f.splice(i,1) : f.push(v); b.setAttribute("aria-pressed", i<0); saveDraft(); return; }
  if (act === "d-prev" || act === "d-next"){ const nd = addDays(draft.date, act==="d-prev"?-1:1); if (nd <= todayISO()){ draft.date = nd; saveDraft(); render(); } return; }
  if (act === "r-prev" || act === "r-next"){ const k = act==="r-prev"?-1:1; if (range==="week") anchor = addDays(anchor, 7*k); else { const d = new Date(anchor+"T12:00:00"); d.setDate(1); d.setMonth(d.getMonth()+k); anchor = d.toISOString().slice(0,10); } render(); return; }
  if (act === "save"){
    const D = draft;
    const entries = D.entries.filter(en => en.reps.some(r=>r!=="")).map(en => ({ex:en.ex, w:en.w===""?0:en.w, reps:en.reps.filter(r=>r!==""), rpe:en.rpe, pain:!!issueOf(en), issue:issueOf(en), note:en.note||""}));
    if (!entries.length){ toast("Впиши повторы хотя бы в одном упражнении"); return; }
    const P = PLAN().days, c = cycleOn(D.date);
    const w = {id: D.id || newId("w"), date:D.date, dayKey: D.custom ? (S.workouts.find(x=>x.id===D.id)?.dayKey||"") : D.day, day: D.custom ? D.dayLabel : `${P[D.day].title} ${P[D.day].sub}`, feel:D.feel, entries, dc:c?.dc??null};
    b.disabled = true;
    try{ await put("workouts", w); }catch(_){ b.disabled = false; return; }
    const wasEdit = !!D.id; draft = null; newDraft(wasEdit ? nextDay() : ["D1","D2","D3"][(["D1","D2","D3"].indexOf(w.dayKey)+1)%3]);
    toast(wasEdit ? "Изменения сохранены" : "Тренировка сохранена"); tab = "progress"; anchor = w.date; ls.set(LKEY+":tab", tab); render(); window.scrollTo(0,0); return;
  }
  if (act === "cancel-edit"){ draft = null; newDraft(nextDay()); render(); return; }
  if (act === "edit-w"){ const w = S.workouts.find(x=>x.id===b.dataset.id); if (w){ editWorkout(w); tab = "train"; ls.set(LKEY+":tab", tab); render(); window.scrollTo(0,0); } return; }
  if (act === "del-ask"){ confirmDel = b.dataset.id; render(); return; }
  if (act === "del-no"){ confirmDel = null; render(); return; }
  if (act === "del-w"){ confirmDel = null; await del("workouts", b.dataset.id); toast("Тренировка удалена"); return; }
  if (act === "del-p"){ confirmDel = null; await del("periods", b.dataset.id); return; }
  if (act === "dc-" || act === "dc+"){ const c = cycleOn(draft.date); if (!c){ toast("Впиши день цикла числом"); return; } await applyDC(c.dc + (act==="dc+"?1:-1)); return; }
  if (act === "pe-edit"){ editP = b.dataset.id; confirmDel = null; render(); return; }
  if (act === "pe-cancel"){ editP = null; render(); return; }
  if (act === "pe-save"){ const v = document.getElementById("pe-date").value, p = S.periods.find(x=>x.id===b.dataset.id);
    if (v && p){ if (v !== p.date && starts().includes(v)){ toast("Такая дата уже есть"); return; } editP = null; await put("periods", {...p, date:v}); toast("Дата цикла обновлена"); render(); } return; }
  if (act === "del-m"){ confirmDel = null; await del("measures", b.dataset.id); return; }
  if (act === "add-period"){ const v = document.getElementById("p-date").value; if (v && !starts().includes(v)){ await put("periods", {id:newId("p"), date:v}); toast("Начало цикла добавлено"); } return; }
  if (act === "add-measure"){
    const g = id => { const v = document.getElementById(id).value; return v===""?null:+v; };
    const m = {id:newId("m"), date:document.getElementById("m-date").value, waist:g("m-waist"), hips:g("m-hips"), thigh:g("m-thigh"), chest:g("m-chest")};
    if (!m.date || [m.waist,m.hips,m.thigh,m.chest].every(v=>v==null)){ toast("Впиши дату и хотя бы один обхват"); return; }
    await put("measures", m); toast("Замер добавлен"); return;
  }
  if (act === "export"){ b.disabled = true; await doExport(); b.disabled = false; return; }
  if (act === "copy-csv"){ copyCSV(); return; }
  if (act === "backup"){ exportData(); return; }
  if (act === "sync-paste"){
    let t = ""; try{ t = (await navigator.clipboard.readText()).trim(); }catch(_){ }
    if (!/^(github_pat_|ghp_)/.test(t)){ toast(t ? "В буфере нет ключа — скопируй его на GitHub" : "Не получилось прочитать буфер — нажми «вручную»"); return; }
    b.disabled = true; await connectSync(t); return; }
  if (act === "sync-connect"){ const t = document.getElementById("sync-token").value.trim(); if (!/^(github_pat_|ghp_)/.test(t)){ toast("Ключ начинается с github_pat_"); return; } b.disabled = true; await connectSync(t); return; }
  if (act === "sync-now"){ sync.pending = true; saveSync(); lastLabel = "Данные"; await pushNow(); toast(sync.error ? "Не отправилось" : "Отправлено в базу"); return; }
  if (act === "sync-off"){ confirmDel = null; for (const k of Object.keys(sync)) delete sync[k]; saveSync(); toast("База отключена, записи остались в телефоне"); render(); return; }
  if (act === "backup-later"){ backupLater = true; render(); return; }
});
view.addEventListener("change", e => { if (e.target.id === "import-file"){ const f = e.target.files[0]; if (f) importData(f); e.target.value = ""; } });
document.addEventListener("visibilitychange", () => {
  if (document.hidden){ flushDC(); if (sync.pending) pushNow(); return; }
  rollDraft(); renderSoon(); pullNow();
});
window.addEventListener("pagehide", () => { flushDC(); if (sync.pending) pushNow(); });
window.addEventListener("online", () => { if (sync.pending) pushNow(); else pullNow(); });

rebuildEX();
rollDraft();
render();
pullNow();
// Updates: check on every open/return; a new service worker takes over and the page reloads once.
// The draft is already in localStorage, so a reload loses nothing.
if ("serviceWorker" in navigator){
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController && !reloaded){ reloaded = true; location.reload(); } });
  navigator.serviceWorker.register("./sw.js", {updateViaCache:"none"}).then(reg => {
    const check = () => reg.update().catch(()=>{});
    document.addEventListener("visibilitychange", () => { if (!document.hidden) check(); });
    window.addEventListener("pageshow", check);
  }).catch(()=>{});
}
</script>
</body>
